name: Z-Blog Autonomous Local Bridge
on:
  push:
    branches:
      - feature/gpt-codex-bridge-v1
    paths:
      - 'bridge/request.json'
  workflow_dispatch:

# A GitHub-hosted runner cannot validate 127.0.0.1 on the owner's Windows box.
# This workflow ONLY runs on a separately registered, trusted local Windows runner.
permissions:
  contents: read
  actions: read

# Resolved only on the trusted Windows runner. Never commit credential values.
env:
  XZ_ZBLOG_WORKSPACE: ${{ vars.XZ_ZBLOG_WORKSPACE }}
  XZ_VISIT_STATS_NOTION_TARGET: ${{ vars.XZ_VISIT_STATS_NOTION_TARGET }}
  OPENAI_CONTROLLER_MODEL: ${{ vars.OPENAI_CONTROLLER_MODEL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  GH_TOKEN: ${{ secrets.BRIDGE_GH_TOKEN }}

concurrency:
  group: zblog-bridge-local
  cancel-in-progress: false

jobs:
  autonomous-plugin-development:
    if: github.ref == 'refs/heads/feature/gpt-codex-bridge-v1'
    runs-on: [self-hosted, Windows, XZ-ZBLOG-LOCAL]
    timeout-minutes: 360
    steps:
      - name: Checkout isolated Bridge control plane
        uses: actions/checkout@v4
        with:
          ref: feature/gpt-codex-bridge-v1
          persist-credentials: false

      - name: Verify local executor configuration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:XZ_ZBLOG_WORKSPACE)) { throw 'BLOCKED_LOCAL_EXECUTOR_ACCESS: workspace not configured' }
          if ([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY)) { throw 'BLOCKED_CREDENTIALS: GPT API key missing' }
          if ([string]::IsNullOrWhiteSpace($env:NOTION_TOKEN)) { throw 'BLOCKED_CREDENTIALS: Notion token missing' }
          if ([string]::IsNullOrWhiteSpace($env:OPENAI_CONTROLLER_MODEL)) { throw 'BLOCKED_CREDENTIALS: GPT controller model missing' }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'BLOCKED_CREDENTIALS: GitHub release token missing' }
          if ([string]::IsNullOrWhiteSpace($env:XZ_VISIT_STATS_NOTION_TARGET)) { throw 'BLOCKED_CREDENTIALS: Notion target page missing' }
          if (-not (Test-Path -LiteralPath $env:XZ_ZBLOG_WORKSPACE)) { throw 'BLOCKED_LOCAL_EXECUTOR_ACCESS: real Windows workspace absent' }
          if (-not (Test-Path -LiteralPath 'D:\wwwroot\www.xzhao.net')) { throw 'BLOCKED_LOCAL_RUNTIME: Z-Blog testing site absent' }

      - name: Configure Git credential helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          gh auth status
          if ($LASTEXITCODE -ne 0) { throw 'BLOCKED_GITHUB_AUTH: gh auth status failed' }
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'BLOCKED_GITHUB_AUTH: cannot configure git credential helper' }

      - name: Execute one-goal autonomous development to release
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bridge-host.ps1 -WorkspaceRoot $env:XZ_ZBLOG_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
